<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrintZone – Custom Printing Studio | Personalized Apparel, Bags, Gifts & Stationery</title>
    <meta name="description" content="PrintZone – Custom Printing Studio. Design and order custom printed T-shirts, hoodies, tote bags, pin badges, calendars, mugs, visiting cards, and corporate gifts online." />
    <meta property="og:title" content="PrintZone – Custom Printing Studio" />
    <meta property="og:description" content="Your Ideas. Our Prints. Interactive online design studio for custom apparel, bags, badges, calendars, and business printing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-white text-zinc-950 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script>
      // Automatic fallback loader when GitHub Pages serves directly from the `main` branch
      (function () {
        if (
          window.location.hostname.indexOf('github.io') !== -1 &&
          !document.querySelector('script[src*="assets/app.js"]')
        ) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './bundle/assets/index.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.src = './bundle/assets/app.js';
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
